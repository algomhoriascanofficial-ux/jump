<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d14">
<title>Assessment | Body Assessment</title>
<style>
:root{--bg:#090d14;--card:#121826;--line:#232c3f;--text:#f2f5fb;--muted:#8d97ad;--accent:#ff6a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:3px;font-size:1.05rem}
.logo b{color:var(--accent)}
#lang{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:.9rem}
.hero{padding:56px 28px 28px;max-width:1150px;margin:0 auto}
.eyebrow{color:var(--accent);font-size:.8rem;letter-spacing:2px;font-weight:700}
h1{font-size:clamp(3rem,10vw,6.5rem);line-height:1;margin:12px 0;font-weight:900;letter-spacing:-1px}
h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:620px;line-height:1.7;font-size:1.05rem}
.filters{display:flex;gap:10px;flex-wrap:wrap;max-width:1150px;margin:0 auto;padding:10px 28px}
.pill{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:99px;cursor:pointer;font-size:.92rem}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;max-width:1150px;margin:0 auto;padding:18px 28px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:start;color:var(--text);transition:.2s;display:flex;flex-direction:column;gap:10px;min-height:150px}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card .cat{color:var(--accent);font-size:.75rem;letter-spacing:1.5px;font-weight:700}
.card h3{margin:0;font-size:1.2rem}
.card .meta{color:var(--muted);font-size:.9rem}
.card .go{margin-top:auto;font-size:.88rem;font-weight:700}
.card.soon{opacity:.55;cursor:default}
.card.soon:hover{border-color:var(--line);transform:none}
.cta{max-width:1150px;margin:0 auto;padding:0 28px 60px}
.cta div{background:linear-gradient(135deg,#1a2033,#121826);border:1px solid var(--line);border-radius:20px;padding:34px}
.cta h2{margin:0 0 8px;font-size:1.8rem}
.cta p{color:var(--muted);margin:0 0 18px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;padding:12px 22px;border-radius:99px;font-weight:700;text-decoration:none;cursor:pointer;font-size:.95rem}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:24px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(4,6,10,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;width:min(460px,100%);padding:16px;max-height:100%;overflow:auto}
.box video{width:100%;max-height:62vh;border-radius:12px;background:#000;display:block}
.box h3{margin:12px 0 4px;font-size:1.2rem}
.box .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav button{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:99px;cursor:pointer}
.nav .x{border-color:var(--accent);color:var(--accent)}
.err{color:#ff8a8a;font-size:.85rem;display:none;margin-bottom:8px}
@media(max-width:600px){.top,.hero,.filters,.grid,.cta{padding-inline:16px}}
.card{cursor:default;min-height:0}.card:hover{transform:none}
.card video{width:100%;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:12px;display:block}
.meta:empty{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="logo">ASSESS<b>MENT</b></div>
  <button id="lang" type="button"></button>
</div>

<section class="hero">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p id="intro"></p>
</section>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<section class="cta"><div>
  <h2 id="ctaH"></h2>
  <p id="ctaP"></p>
  <a class="btn" id="ctaBtn" style="display:none" target="_blank" rel="noopener"></a>
</div></section>
<footer id="foot"></footer>

<script>
// ✏️ ضع رقم واتساب هنا (مثال: "201000000000") ليظهر الزر / Put WhatsApp number to show the button
const WHATSAPP = "";

// file:"" معناها مفيش فيديو لسه / empty file = video coming soon
const CATS = {
  all:{ar:"الكل",en:"All"},
  strength:{ar:"القوة",en:"Strength"},
  endurance:{ar:"التحمل",en:"Endurance"},
  flex:{ar:"المرونة",en:"Flexibility"},
  skills:{ar:"المهارات",en:"Skills"}
};
const EX = [
  {c:"strength",f:"videos/half-push-ups.mp4",ar:"ضغط نص (Half Push Ups)",en:"Half Push Ups",mar:"لمدة دقيقة",men:"One minute"},
  {c:"strength",f:"videos/push-ups.mp4",ar:"ضغط (Push Ups)",en:"Push Ups",mar:"لمدة دقيقة",men:"One minute"},
  {c:"strength",f:"videos/squats.mp4",ar:"سكوات (Squats)",en:"Squats",mar:"لمدة دقيقة",men:"One minute"},
  {c:"strength",f:"videos/sit-ups.mp4",ar:"سيت أب (Sit Up)",en:"Sit Up",mar:"لمدة دقيقة",men:"One minute"},
  {c:"endurance",f:"videos/plank.mp4",ar:"بلانك (Plank)",en:"Plank",mar:"أقصى مدة",men:"Max time"},
  {c:"endurance",f:"videos/hollow.mp4",ar:"هولو (Hollow)",en:"Hollow",mar:"أقصى مدة",men:"Max time"},
  {c:"flex",f:"videos/shoulder.mp4",ar:"الكتف (Shoulder)",en:"Shoulder",mar:"",men:""},
  {c:"flex",f:"videos/legs.mp4",ar:"الرجلين (Legs)",en:"Legs",mar:"",men:""},
  {c:"flex",f:"videos/back.mp4",ar:"الظهر (Back)",en:"Back",mar:"",men:""},
  {c:"flex",f:"videos/bridge.mp4",ar:"الكوبري (Bridge)",en:"Bridge",mar:"",men:""},
  {c:"flex",f:"videos/split.mp4",ar:"السبليت (Split)",en:"Split",mar:"",men:""},
  {c:"skills",f:"videos/skills.mp4",ar:"المهارات (Skills)",en:"Skills",mar:"أي الحركات اللي يقدر يعملها",men:"Which moves he can do"}
];
const T = {
  ar:{lang:"English",eyebrow:"تقييم الجسم • ONLINE ASSESSMENT",h1:["تقييم","الجسم."],intro:"اختر القسم واضغط على أي تمرين لمشاهدة الفيديو هنا. القوة، التحمل، المرونة والمهارات.",watch:"شاهد الفيديو ←",soon:"الفيديو قريبًا",ctaH:"جاهز للمستوى التالي؟",ctaP:"احصل على خطة شخصية ومتابعة أسبوعية. راسلنا وابدأ الآن.",wa:"تواصل على واتساب",foot:"© ASSESSMENT • قيّم مستواك وتدرّب ضمن قدراتك.",prev:"→ السابق",next:"التالي ←",close:"✕ إغلاق",err:"تعذّر تحميل الفيديو."},
  en:{lang:"العربية",eyebrow:"ONLINE ASSESSMENT • BODY TEST",h1:["BODY","ASSESSMENT."],intro:"Choose a section and tap any exercise to watch it right here. Strength, endurance, flexibility and skills.",watch:"Watch video →",soon:"Video coming soon",ctaH:"READY TO LEVEL UP?",ctaP:"Get a personal plan and weekly follow-up. Send us a message and let's start.",wa:"Chat on WhatsApp",foot:"© ASSESSMENT • Test your level and train within your ability.",prev:"← Prev",next:"Next →",close:"✕ Close",err:"Could not load this video.",},
};
let lang="ar",cat="all",cur=-1,list=[];
try{lang=localStorage.getItem("as_lang")||"ar"}catch(e){}
const $=id=>document.getElementById(id);
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("lang").textContent=t.lang;$("eyebrow").textContent=t.eyebrow;
  $("h1").innerHTML=t.h1[0]+"<br><span>"+t.h1[1]+"</span>";
  $("intro").textContent=t.intro;$("ctaH").textContent=t.ctaH;$("ctaP").textContent=t.ctaP;$("foot").textContent=t.foot;
  if(WHATSAPP){const a=$("ctaBtn");a.style.display="inline-block";a.textContent=t.wa;a.href="https://wa.me/"+WHATSAPP}
  $("filters").innerHTML="";
  Object.keys(CATS).forEach(k=>{
    const n=k==="all"?EX.length:EX.filter(e=>e.c===k).length;
    const b=document.createElement("button");b.type="button";b.className="pill"+(k===cat?" on":"");
    b.textContent=CATS[k][lang]+" ("+n+")";b.onclick=()=>{cat=k;render()};$("filters").appendChild(b);
  });
  $("grid").innerHTML="";
  EX.filter(e=>cat==="all"||e.c===cat).forEach(e=>{
    const b=document.createElement("div");b.className="card";
    const v=document.createElement("video");v.controls=true;v.playsInline=true;v.preload="metadata";v.src=e.f+"#t=0.1";
    const c=document.createElement("span");c.className="cat";c.textContent=CATS[e.c][lang].toUpperCase();
    const h=document.createElement("h3");h.textContent=e[lang];
    const m=document.createElement("span");m.className="meta";m.textContent=lang==="ar"?e.mar:e.men;
    b.append(v,c,h,m);$("grid").appendChild(b);
  });
}
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("as_lang",lang)}catch(e){}render()};
render();
</script>
</body>
</html>
